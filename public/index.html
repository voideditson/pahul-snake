<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slither Arena Pro</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050914; color: #FFF; font-family: 'Rajdhani', sans-serif; }
    #game-canvas { display: block; width: 100vw; height: 100vh; background: #0A0F1D; }

    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(16, 24, 46, 0.9) 0%, rgba(5, 9, 20, 0.98) 100%); backdrop-filter: blur(15px); z-index: 10; }
    .card { background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(56, 189, 248, 0.4); border-radius: 1.5rem; padding: 3rem 2rem; text-align: center; box-shadow: 0 0 40px rgba(56, 189, 248, 0.15), inset 0 0 30px rgba(0,0,0,0.8); }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; background: linear-gradient(135deg, #38BDF8, #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.2rem; }
    p.subtitle { color: #94A3B8; font-size: 1.2rem; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 3px; }

    input[type="text"] { width: 100%; padding: 1rem; border-radius: 0.5rem; border: 2px solid #334155; background: rgba(0,0,0,0.5); color: white; text-align: center; font-size: 1.4rem; font-weight: 700; outline: none; margin-bottom: 1.5rem; }
    .skin-picker { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; }
    .skin-dot { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 3px solid rgba(255,255,255,0.1); transition: all 0.2s; }
    .skin-dot.selected { border-color: #FFF; transform: scale(1.3); }

    .btn { width: 100%; background: linear-gradient(90deg, #2563EB, #8B5CF6); color: white; border: none; padding: 1.2rem; border-radius: 0.5rem; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.5rem; cursor: pointer; transition: all 0.2s; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(139, 92, 246, 0.6); }

    #hud { position: absolute; top: 1.5rem; left: 1.5rem; pointer-events: none; z-index: 5; }
    .hud-box { background: rgba(15, 23, 42, 0.8); border-left: 4px solid #38BDF8; padding: 1rem; border-radius: 0 0.5rem 0.5rem 0; }
    
    #controls-hint { margin-top: 1rem; color: #10B981; font-weight: bold; }

    /* Top Right Menu */
    .top-right-ui { position: absolute; top: 1.5rem; right: 1.5rem; z-index: 5; display: flex; flex-direction: column; gap: 0.5rem; width: 240px; }
    
    #bot-toggle-btn { background: #1E293B; border: 1px solid #334155; color: #FFF; padding: 0.8rem; border-radius: 0.5rem; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; }
    #bot-toggle-btn:hover { background: #334155; }
    #bot-toggle-btn.off { border-color: #EF4444; color: #EF4444; }

    #leaderboard { background: rgba(15, 23, 42, 0.8); border-radius: 0.5rem; overflow: hidden; pointer-events: none; }
    #leaderboard h3 { background: rgba(56, 189, 248, 0.2); padding: 0.75rem; text-align: center; color: #38BDF8; margin: 0; }
    .lb-row { display: flex; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 700; }
    
    #boost-btn { position: absolute; bottom: 2.5rem; right: 2.5rem; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #F59E0B, #B45309); border: 4px solid rgba(255,255,255,0.3); color: white; font-family: 'Orbitron', sans-serif; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; pointer-events: auto; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Menu -->
  <div class="overlay" id="menu-overlay">
    <div class="card">
      <h1>SNAKE.IO</h1>
      <p class="subtitle">Next-Gen PvP Arena</p>
      <input type="text" id="username" placeholder="ENTER CODENAME" maxlength="12" value="Ghost">
      
      <div class="skin-picker">
        <div class="skin-dot selected" style="background:#38BDF8;" onclick="selectSkin('#38BDF8', this)"></div>
        <div class="skin-dot" style="background:#10B981;" onclick="selectSkin('#10B981', this)"></div>
        <div class="skin-dot" style="background:#F59E0B;" onclick="selectSkin('#F59E0B', this)"></div>
        <div class="skin-dot" style="background:#EC4899;" onclick="selectSkin('#EC4899', this)"></div>
        <div class="skin-dot" style="background:#8B5CF6;" onclick="selectSkin('#8B5CF6', this)"></div>
      </div>

      <button class="btn" id="play-btn" onclick="playGame()">JOIN ARENA</button>
      <div id="controls-hint">💻 Steer: Mouse or W A S D<br>🚀 Boost: Click or SPACEBAR</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-box">
      <div style="font-size: 0.9rem; color: #94A3B8; font-weight:700;">MASS</div>
      <div id="score-val" style="font-family:'Orbitron'; font-size: 2rem; color: #38BDF8;">10</div>
    </div>
  </div>

  <!-- Top Right (Bots & Leaderboard) -->
  <div class="top-right-ui hidden" id="top-right">
    <button id="bot-toggle-btn" onclick="toggleBots()">🤖 AI BOTS: ON</button>
    <div id="leaderboard">
      <h3>TOP PLAYERS</h3>
      <div id="lb-list"></div>
    </div>
  </div>

  <!-- Mobile/Mouse Boost Button -->
  <div id="boost-btn" class="hidden">BOOST</div>

  <canvas id="game-canvas"></canvas>

  <script>
    const socket = io();
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    let myId = null;
    let selectedSkin = '#38BDF8';
    let isBoosting = false;
    let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    
    // Keyboard Tracking
    let keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
    
    let gameState = { snakes: {}, foods: [] };
    let worldSize = 3000;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function selectSkin(color, el) {
      selectedSkin = color;
      document.querySelectorAll('.skin-dot').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
    }

    function playGame() {
      const name = document.getElementById('username').value.trim() || 'Ghost';
      socket.emit('joinGame', { username: name, skin: selectedSkin });
    }

    function toggleBots() {
      socket.emit('toggleBots');
    }

    socket.on('botsToggled', (enabled) => {
      const btn = document.getElementById('bot-toggle-btn');
      if(enabled) {
        btn.innerText = "🤖 AI BOTS: ON";
        btn.classList.remove('off');
      } else {
        btn.innerText = "🤖 AI BOTS: OFF";
        btn.classList.add('off');
      }
    });

    socket.on('init', (data) => {
      myId = data.id;
      worldSize = data.worldSize;
      
      document.getElementById('menu-overlay').classList.add('hidden');
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('top-right').classList.remove('hidden');
      document.getElementById('boost-btn').classList.remove('hidden');
    });

    socket.on('gameState', (state) => {
      gameState = state;
      if (myId && (!gameState.snakes[myId] || gameState.snakes[myId].dead)) {
        myId = null;
        document.getElementById('menu-overlay').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('top-right').classList.add('hidden');
        document.getElementById('boost-btn').classList.add('hidden');
      }
    });

    // INPUT HANDLING
    window.addEventListener('mousemove', (e) => { mousePos = { x: e.clientX, y: e.clientY }; sendInput(); });
    
    // Mouse / Touch Boost
    const boostBtn = document.getElementById('boost-btn');
    boostBtn.addEventListener('mousedown', () => { isBoosting = true; sendInput(); });
    boostBtn.addEventListener('mouseup', () => { isBoosting = false; sendInput(); });
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; sendInput(); });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; sendInput(); });

    // Keyboard WASD / Space Handling
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ') isBoosting = true;
      const key = e.key.toLowerCase();
      if (keys.hasOwnProperty(key)) keys[key] = true;
      sendInput();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === ' ') isBoosting = false;
      const key = e.key.toLowerCase();
      if (keys.hasOwnProperty(key)) keys[key] = false;
      sendInput();
    });

    function getInputAngle() {
      let dx = 0, dy = 0;
      if (keys.w || keys.arrowup) dy -= 1;
      if (keys.s || keys.arrowdown) dy += 1;
      if (keys.a || keys.arrowleft) dx -= 1;
      if (keys.d || keys.arrowright) dx += 1;

      // If WASD is pressed, use those coordinates
      if (dx !== 0 || dy !== 0) {
        return Math.atan2(dy, dx);
      }
      
      // Fallback to mouse tracking
      return Math.atan2(mousePos.y - canvas.height / 2, mousePos.x - canvas.width / 2);
    }

    function sendInput() {
      if (!myId) return;
      socket.emit('playerInput', { angle: getInputAngle(), isBoosting });
    }

    // CLIENT RENDERER
    function render() {
      ctx.fillStyle = '#050914';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const mySnake = myId ? gameState.snakes[myId] : null;
      const camX = mySnake ? mySnake.x - canvas.width / 2 : worldSize / 2 - canvas.width / 2;
      const camY = mySnake ? mySnake.y - canvas.height / 2 : worldSize / 2 - canvas.height / 2;

      // Grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 100;
      for (let x = -camX % gridSize; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = -camY % gridSize; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      // Boundaries
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 4;
      ctx.strokeRect(-camX, -camY, worldSize, worldSize);

      // Foods
      gameState.foods.forEach(f => {
        ctx.beginPath(); ctx.arc(f.x - camX, f.y - camY, f.size, 0, Math.PI * 2); ctx.fillStyle = f.color;
        ctx.shadowBlur = 10; ctx.shadowColor = f.color; ctx.fill(); ctx.shadowBlur = 0;
      });

      // Snakes
      Object.values(gameState.snakes).forEach(s => {
        if (s.dead) return;
        for (let i = s.body.length - 1; i >= 0; i--) {
          const seg = s.body[i];
          ctx.beginPath(); ctx.arc(seg.x - camX, seg.y - camY, 14, 0, Math.PI * 2);
          ctx.fillStyle = s.color; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2; ctx.stroke();
        }

        const headX = s.x - camX, headY = s.y - camY;
        ctx.beginPath(); ctx.arc(headX + Math.cos(s.angle + 0.5) * 8, headY + Math.sin(s.angle + 0.5) * 8, 4, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill();
        ctx.beginPath(); ctx.arc(headX + Math.cos(s.angle - 0.5) * 8, headY + Math.sin(s.angle - 0.5) * 8, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(headX + Math.cos(s.angle + 0.5) * 8, headY + Math.sin(s.angle + 0.5) * 8, 2, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
        ctx.beginPath(); ctx.arc(headX + Math.cos(s.angle - 0.5) * 8, headY + Math.sin(s.angle - 0.5) * 8, 2, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = 'bold 14px Rajdhani'; ctx.textAlign = 'center'; ctx.fillText(s.name, headX, headY - 22);
      });

      if (mySnake) document.getElementById('score-val').innerText = Math.floor(mySnake.score);

      const sorted = Object.values(gameState.snakes).sort((a, b) => b.score - a.score).slice(0, 5);
      document.getElementById('lb-list').innerHTML = sorted.map((s, idx) => `
        <div class="lb-row" style="color: ${s.id === myId ? '#38BDF8' : '#94A3B8'}">
          <span>${idx + 1}. ${s.name}</span>
          <span>${Math.floor(s.score)}</span>
        </div>
      `).join('');

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
